<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            animation: slideUp 0.6s ease-out;
            text-align: center;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .welcome-icon {
            font-size: 4em;
            margin-bottom: 20px;
            animation: bounce 0.6s ease-out;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .username {
            color: #667eea;
            font-size: 1em;
            font-weight: 600;
        }

        .divider {
            width: 60px;
            height: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 30px auto;
            border-radius: 2px;
        }

        .content-section {
            text-align: left;
            margin: 30px 0;
        }

        .section-title {
            color: #333;
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-content {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            color: #666;
            line-height: 1.6;
            border-left: 4px solid #667eea;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            margin-top: 40px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-size: 1em;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #f8f9fa;
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 25px;
            }

            h1 {
                font-size: 2em;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="welcome-icon">🎊</div>
        <h1>Welcome, <span class="username" id="displayName">User</span>!</h1>
        <div class="divider"></div>

        <p style="color: #666; font-size: 1.1em; margin-bottom: 30px;">
            We're thrilled to have you on board. Here's what we know about you:
        </p>

        <div class="content-section">
            <div class="section-title">
                <span>🎯</span>
                <span>Your Goal</span>
            </div>
            <div class="section-content" id="userWantsDisplay">
                Loading your information...
            </div>
        </div>

        <p style="color: #666; margin-top: 30px; font-size: 1em;">
            We're here to help you achieve your goals. Let's get started!
        </p>

        <div class="action-buttons">
            <button class="btn btn-primary" onclick="startJourney()">Let's Go! 🚀</button>
            <button class="btn btn-secondary" onclick="editInfo()">Edit Info</button>
        </div>
    </div>

    <script>
        // Retrieve user data from localStorage
        function loadUserData() {
            const userName = localStorage.getItem('userName');
            const userWants = localStorage.getItem('userWants');

            if (userName) {
                document.getElementById('displayName').textContent = userName;
            }

            if (userWants) {
                document.getElementById('userWantsDisplay').textContent = userWants;
            } else {
                document.getElementById('userWantsDisplay').textContent = 'No information provided yet.';
            }
        }

        // Go back to edit information
        function editInfo() {
            window.location.href = 'index.html';
        }

        // Start journey (placeholder function)
        function startJourney() {
            alert('Welcome aboard! The journey begins here. 🌟');
            // You can add more functionality here
        }

        // Load data when page loads
        window.addEventListener('load', loadUserData);
    </script>
</body>
</html>
