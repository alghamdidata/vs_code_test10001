<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - User Entries</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 900px;
            margin: 0 auto;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #333;
            font-size: 2em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1em;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-size: 0.95em;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }

        .btn-secondary:hover {
            background: #e8e8e8;
            transform: scale(1.05);
        }

        .table-wrapper {
            overflow-x: auto;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: #f8f9fa;
            border-bottom: 2px solid #667eea;
        }

        th {
            padding: 15px;
            text-align: left;
            color: #333;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 0.5px;
        }

        td {
            padding: 15px;
            color: #666;
            border-bottom: 1px solid #e0e0e0;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        tbody tr:nth-child(even) {
            background: #fafbfc;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .empty-state-text {
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .empty-state-subtext {
            font-size: 0.95em;
            color: #bbb;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .links a {
            color: #667eea;
            text-decoration: none;
            margin: 0 15px;
            font-size: 0.95em;
            transition: color 0.3s ease;
        }

        .links a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .entry-count {
            color: #999;
            font-size: 0.95em;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 1.5em;
            }

            th, td {
                padding: 10px;
                font-size: 0.9em;
            }

            .controls {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 User Entry History</h1>
        <p class="subtitle">View all your previous entries</p>

        <div class="controls">
            <button class="btn btn-primary" onclick="downloadCSV()">📥 Download as CSV</button>
            <button class="btn btn-secondary" onclick="clearHistory()">🗑️ Clear History</button>
            <button class="btn btn-secondary" onclick="goHome()">➕ New Entry</button>
        </div>

        <div class="table-wrapper">
            <table id="historyTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>What They Want</th>
                        <th>Date & Time</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-state-icon">📭</div>
                <div class="empty-state-text">No entries yet</div>
                <div class="empty-state-subtext">Start by creating a new entry</div>
            </div>
        </div>

        <div class="entry-count" id="entryCount"></div>

        <div class="links">
            <a href="index.html">← Back to Form</a> | <a href="page2.html">Welcome Page</a>
        </div>
    </div>

    <script>
        function loadHistory() {
            const entries = JSON.parse(localStorage.getItem('userEntries') || '[]');
            const tableBody = document.getElementById('tableBody');
            const emptyState = document.getElementById('emptyState');
            const entryCount = document.getElementById('entryCount');

            if (entries.length === 0) {
                emptyState.style.display = 'block';
                document.getElementById('historyTable').style.display = 'none';
                entryCount.textContent = '';
            } else {
                emptyState.style.display = 'none';
                document.getElementById('historyTable').style.display = 'table';
                tableBody.innerHTML = '';

                entries.forEach((entry, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${escapeHtml(entry.name)}</td>
                        <td>${escapeHtml(entry.wants)}</td>
                        <td>${escapeHtml(entry.date)}</td>
                    `;
                    tableBody.appendChild(row);
                });

                entryCount.textContent = `Total entries: ${entries.length}`;
            }
        }

        function downloadCSV() {
            const entries = JSON.parse(localStorage.getItem('userEntries') || '[]');

            if (entries.length === 0) {
                alert('No entries to download');
                return;
            }

            let csv = 'Name,What They Want,Date & Time\n';

            entries.forEach(entry => {
                const name = `"${entry.name.replace(/"/g, '""')}"`;
                const wants = `"${entry.wants.replace(/"/g, '""')}"`;
                const date = `"${entry.date}"`;
                csv += `${name},${wants},${date}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);

            link.setAttribute('href', url);
            link.setAttribute('download', 'user_entries.csv');
            link.style.visibility = 'hidden';

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function clearHistory() {
            if (confirm('Are you sure you want to clear all entries? This cannot be undone.')) {
                localStorage.removeItem('userEntries');
                loadHistory();
            }
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        window.addEventListener('load', loadHistory);
    </script>
</body>
</html>
